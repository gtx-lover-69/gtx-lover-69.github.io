        <style>
            .item {
                animation: fade-up 0.6s 0.3s both;
                box-sizing: border-box;
                color: #fff;
                background-color: #000;
                padding: 0.3em;
                gap: 0.3em;

            .item:hover .card-title {

            .text-container {

            }

                display: block;
            }

            @media (max-width: 720px) {

                }

                    font-size: 5.8vw;
                    text-shadow: 0px 0px 8px currentColor;
                }

                }

            }

    </head>
    <body>

        <div class="nav">

            <a href="aboutme.html">/aboutme</a>

        </div>
        <div class="main-container">
            <a href="https://github.com/gtx-lover-69/mew-version-control" class="item">
                <img class="image" src="assets/mew.png">

                    <p class="card-title" style="color: #ffb4ce; font-weight: bold;">Mew</p>
                    <p>Git, but for Scratch.</p>
                </div>
            </a>
            <a href="https://github.com/gtx-lover-69/Matteo-CLI-FileTool" class="item">
                <img class="image" src="assets/filetool.png">
                <div class="text-container">
                    <p class="card-title" style="color: #0083fb; font-weight: bold;">FileTool</p>

            <a href="https://github.com/gtx-lover-69/utilityhub" class="item">

        <div class="stickyboi">
            <p>made with ♥ by matteo</p>
            <p><a id="commit-link" href="#" style="color:#fff;">loading commit...</a></p>
        </div>
        <script>
            async function loadLatestCommit() {
                const owner = "gtx-lover-69";
                const repo = "gtx-lover-69.github.io";
                const branch = "main";

                const el = document.getElementById("commit-link");
                try {
                    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/commits/${branch}`);
                    const json = await res.json();
                    const sha = json.sha.slice(0, 7);
                    el.textContent = `commit ${sha}`;
                    el.href = json.html_url;
                } catch (err) {
                    console.error("Commit fetch failed:", err);
                    el.textContent = "commit unknown";
                }
            }
            loadLatestCommit();

            const body = document.body;

            let targetX = 0, targetY = 0;
            let currentX = 0, currentY = 0;
            const lerpFactor = 0.1;

            function detectMob() {
                return ((window.innerWidth <= 720));
            }

            body.addEventListener('mousemove', (e) => {
                const rect = body.getBoundingClientRect();
                let isMobile = detectMob;
                if (!isMobile()) {
                    targetX = 0 -((e.clientX - rect.left) / rect.width);
                    targetY = 0 -((e.clientY - rect.top) / rect.height);
                }
                
            });

            function animateBG() {
                currentX += (targetX - currentX) * lerpFactor;
                currentY += (targetY - currentY) * lerpFactor;

                body.style.setProperty('--bg-x', `${currentX}%`);
                body.style.setProperty('--bg-y', `${currentY}%`);
                requestAnimationFrame(animateBG);
            }

            requestAnimationFrame(animateBG);
        </script>
    </body>
