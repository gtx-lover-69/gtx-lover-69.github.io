<!DOCTYPE html>

<html lang="en">
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Climate+Crisis:YEAR@1979&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">        
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Tools | Matteo's Site</title>
        <style>
            @keyframes fade-up {
                0% {
                    opacity: 0;
                    transform: translateY(10px) scale(0.95);
                    filter: blur(10px);
                }

                100% {
                    opacity: 1;
                    transform: translateY(0px) scale(1);
                    filter: blur(0px);
                }
            }

            html {
                cursor: url('assets/cursor.png'), default;
                scroll-behavior: smooth;
            }

            a, button {
                cursor: url('assets/hover.png'), pointer;
            }

            body {
                background-color: #000;
                color: #fff;
                margin: 0;
                padding: 0;
                
                width: 100%;
                height: 100vh;
                
                background-image: linear-gradient(rgba(55, 55, 55, 1) .1em, transparent .1em), linear-gradient(90deg, rgba(55, 55, 55, 1) .1em, transparent .1em);
                background-size: 3em 3em;
            }
                        
            h1 {
                animation: fade-up 0.6s 0.1s both;
                text-align: center;
                font-family: 'Climate Crisis', sans-serif;
                color: #fff;
                font-size: 12vw;
                letter-spacing: 0.05em;
                line-height: 1;
                margin: 0;
                padding: 0;
                transition-duration: 0.3s;
                transition-timing-function: ease-in-out;
            }

            p, a {
                animation: fade-up 0.6s 0.3s both;
                text-align: center;
                font-family: 'Space Grotesk', monospace;
                font-size: 2vw;
                letter-spacing: 0.01em;
                line-height: 1.2;
                margin: auto auto;
            }

            a {
                text-decoration: none;
                color: inherit;
            }

            .main-container {
                box-sizing: border-box;
                width: 95%;
                margin: auto auto;
                columns: 3;
                column-gap: 0.5em;
                align-items: start;
                justify-items: center;
                gap: 0.5em;
                padding: 0.8em;
            }

            .item {
                animation: fade-up 0.6s 0.3s both;
                box-sizing: border-box;
                color: #fff;
                background-color: #000;
                padding: 0.3em;
                gap: 0.3em;
                margin: 0 0 0.5em 0;
                width: 100%;
                text-align: center;
                border-radius: 15px;
                border: dashed 2px #fff;
                display: inline-block;
                break-inside: avoid;
            }

            .item:hover .card-title {
                font-size: 2.4vw;
                text-shadow: 0px 0px 8px currentColor;
            }
            

            .text-container {
                font-weight: normal;
                padding: 0.8vw;
                gap: 0.5em;
            }

            .card-title {
                font-size: 2vw;
                transition-duration: 0.3s;
            }

            .image {
                border-radius: 8px;
                width: 100%;
                height: auto;
                display: block;
            }

            .nav {
                animation: fade-up 0.6s 0.2s both;
                box-sizing: border-box;
                width: 100%;
                padding: 0.8em;
                gap: 0.5em;
                align-items: center;
                backdrop-filter: blur(15px);
                background-color: #00000002;
                display: flex;
            }
            
            .nav p, a {
                transition-duration: 0.3s;
                font-weight: bold;
                margin: auto auto;
            }
            
            .nav a:hover {
                text-shadow: 0px 0px 8px white;
            }


            .stickyboi {
                box-sizing: border-box;
                padding: 0.3em;
                color: #fff;
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                margin: 0 auto;
                z-index: 10;
                backdrop-filter: blur(15px);
            }

            .stickyboi a {
                font-size: 1vw;
                text-decoration: none;
                color: #9cccff;
            }

            .stickyboi p {
                font-size: 1vw;
            }

            @media (max-width: 720px) {
                body {
                    background-size: 2em 2em;
                }

                h1 {
                    padding-top: 0.1em;
                }

                .card-title {
                    font-size: 5vw;
                }

                .item:hover .card-title {
                    font-size: 5.8vw;
                    text-shadow: 0px 0px 8px currentColor;
                }

                p, a {
                    font-size: 4vw;
                }

                .stickyboi a {
                    font-size: 2vw;
                }

                .stickyboi p {
                    font-size: 2vw;
                }

                .main-container {
                    columns: 1;
                }

            }
        </style>
    </head>
    <body>
        <h1>MY TOOLS</h1>
        <div class="nav">
            <a href="https://gtx-lover-69.github.io/">/home</a>
            <p style="color: #9cccff;">/tools</p>
            <a href="aboutme.html">/aboutme</a>
            <a href="hackclub.html">/hackclub</a>
        </div>
        <div class="main-container">
            <a href="https://github.com/gtx-lover-69/mew-version-control" class="item">
                <img class="image" src="assets/mew.png">
                <div class="text-container">
                    <p class="card-title" style="color: #ffb4ce; font-weight: bold;">Mew</p>
                    <p>Git, but for Scratch.</p>
                </div>
            </a>
            <a href="https://github.com/gtx-lover-69/Matteo-CLI-FileTool" class="item">
                <img class="image" src="assets/filetool.png">
                <div class="text-container">
                    <p class="card-title" style="color: #0083fb; font-weight: bold;">FileTool</p>
                    <p>A CLI file reader/writer with file protection.</p>
                </div>
            </a>
            <a href="https://github.com/gtx-lover-69/Matteo-CLI-MusicTool" class="item">
                <img class="image" src="assets/musictool.png">
                <div class="text-container">
                    <p class="card-title" style="color: #0083fb; font-weight: bold;">MusicTool</p>
                    <p>A CLI music player.</p>
                </div>
            </a>
            <a href="https://github.com/gtx-lover-69/utilityhub" class="item">
                <img class="image" src="assets/suite.png">
                <div class="text-container">
                    <p class="card-title" style="color: #0083fb; font-weight: bold;">Utility Suite</p>
                    <p>A CLI Launcher app for all my tools.</p>
                </div>
            </a>
            <a href="https://github.com/gtx-lover-69/ZipPy" class="item">
                <img class="image" src="assets/zippy.png">
                <div class="text-container">
                    <p class="card-title" style="color: #efba2a; font-weight: bold;">ZipPy</p>
                    <p>A lightweight archive tool.</p>
                </div>
            </a>
        </div>
        <div class="stickyboi">
            <p>made with ♥ by matteo</p>
            <p><a id="commit-link" href="#" style="color:#fff;">loading commit...</a></p>
        </div>
        <script>
            async function loadLatestCommit() {
                const owner = "gtx-lover-69";
                const repo = "gtx-lover-69.github.io";
                const branch = "main";

                const el = document.getElementById("commit-link");
                try {
                    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/commits/${branch}`);
                    const json = await res.json();
                    const sha = json.sha.slice(0, 7);
                    el.textContent = `commit ${sha}`;
                    el.href = json.html_url;
                } catch (err) {
                    console.error("Commit fetch failed:", err);
                    el.textContent = "commit unknown";
                }
            }
            loadLatestCommit();

            const body = document.body;

            let targetX = 0, targetY = 0;
            let currentX = 0, currentY = 0;
            const lerpFactor = 0.1;

            function detectMob() {
                return ((window.innerWidth <= 720));
            }

            body.addEventListener('mousemove', (e) => {
                const rect = body.getBoundingClientRect();
                let isMobile = detectMob;
                if (!isMobile()) {
                    targetX = 0 -((e.clientX - rect.left) / rect.width);
                    targetY = 0 -((e.clientY - rect.top) / rect.height);
                }
                
            });

            function animateBG() {
                currentX += (targetX - currentX) * lerpFactor;
                currentY += (targetY - currentY) * lerpFactor;

                body.style.setProperty('--bg-x', `${currentX}%`);
                body.style.setProperty('--bg-y', `${currentY}%`);
                requestAnimationFrame(animateBG);
            }

            requestAnimationFrame(animateBG);
        </script>
    </body>
</html>
