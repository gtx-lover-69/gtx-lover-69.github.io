<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Climate+Crisis:YEAR@1979&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Matteo's Site</title>
        <script src="https://kit.fontawesome.com/885a98fbc7.js" crossorigin="anonymous"></script>
        <style>
            @keyframes fade-up {
                0% {
                    opacity: 0;
                    transform: translateY(10px) scale(0.95);
                    filter: blur(10px);
                }

                100% {
                    opacity: 1;
                    transform: translateY(0px) scale(1);
                    filter: blur(0px);
                }
            }


            html {
                cursor: url('assets/cursor.png'), default;
                scroll-behavior: smooth;
            }

            body {
                background-color: #000;
                margin: 0;
                padding: 0;
                
                width: 100%;
                height: 100vh;

                --bg-x: 0%;
                --bg-y: 0%;
                
                background-image: linear-gradient(rgba(55, 55, 55, 1) .1em, transparent .1em), linear-gradient(90deg, rgba(55, 55, 55, 1) .1em, transparent .1em);
                background-size: 3em 3em;
                background-position: var(--bg-x) var(--bg-y);
            }

            a, button {
                cursor: url('assets/hover.png'), pointer;
            }

            .main-container {
                box-sizing: border-box;
                padding: 0.8em;
                display: grid;
                grid-template-columns: 1fr 3fr;
                align-items: start;
                gap: 0.5em;
                width: 95%;
                margin: auto;
            }

            .items{
                animation: fade-up 0.6s 0.2s both;
                background-color: #000;
                box-sizing: border-box;
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto auto auto;
                grid-template-areas:
                    "title title" 
                    "tools about"
                    "club club";
                justify-content: center;
                align-content: center;
                width: 100%;
                margin: 0 auto;
                font-weight: 600;
                color: #000;
                text-align: center;
                border-radius: 15px;
                font-size: 1.5em;
                border: dashed 2px #fff;
                padding: 0.3em;
                gap: 0.3em;
            }

            .widgets {
                animation: fade-up 0.6s 0.2s both;
                background-color: #000;
                box-sizing: border-box;
                display: grid;
                grid-template-columns: 100%;
                align-items: stretch;
                width: 100%;
                margin: 0 auto;
                font-weight: 600;
                color: #000;
                text-align: center;
                border-radius: 15px;
                font-size: 1.5em;
                border: dashed 2px #fff;
                padding: 0.3em;
                gap: 0.3em;
            }
            
            .github {
                font-family: 'Space Grotesk', monospace;
                display: flex;
                flex-direction: row;
                background-color: #fff;
                color: #000 ;
                text-align: center;
                border-radius: 8px;
                border: 2px solid #fff;
                font-size: 1.5em;
                align-items: center;
                justify-content: center;
                align-content: center;
                justify-items: center;
                padding: 0.3em;
                transition-duration: 0.3s;
                gap: 0.2em;
                text-decoration: none;
                transition-timing-function: ease-in-out;
            }

            .github:hover {
                background-color: #000;
                color: #fff;
                border: 2px solid #fff;
            }

            .github svg {
                transition-timing-function: cubic-bezier();
                transition-duration: 0.3s;
            }

            .github:hover svg {
                scale: 1.2;
            }

            .discord {
                font-family: 'Space Grotesk', monospace;
                display: flex;
                flex-direction: row;
                background-color: #7289da;
                color: #fff ;
                text-align: center;
                border-radius: 8px;
                border: 2px solid #7289da;
                font-size: 1.5em;
                align-items: center;
                justify-content: center;
                align-content: center;
                justify-items: center;
                padding: 0.3em;
                transition-duration: 0.3s;
                gap: 0.2em;
                text-decoration: none;
                transition-timing-function: ease-in-out;
            }

            .discord:hover {
                background-color: #000;
                color: #7289da;
                border: 2px solid #7289da;
            }

            .discord svg {
                transition-timing-function: cubic-bezier();
                transition-duration: 0.3s;
            }

            .discord:hover svg {
                scale: 1.2;
            }

            .coding {
                font-family: 'Space Grotesk', monospace;
                display: flex;
                flex-direction: row;
                background-color: #55ff7f;
                color: #000;
                text-align: center;
                border-radius: 8px;
                border: 2px solid #55ff7f;
                font-size: 1.5em;
                align-items: center;
                justify-content: center;
                align-content: center;
                justify-items: center;
                padding: 0.3em;
                transition-duration: 0.3s;
                gap: 0.2em;
                text-decoration: none;
            }
            
            .tools {
                font-family: 'Space Grotesk', monospace;
                background-color: #9cccff;
                color: #000;
                text-align: center;
                text-justify: left;
                border-radius: 8px;
                border: 2px solid #9cccff;
                padding: 0.3em;
                transition-duration: 0.3s;
                text-decoration: none;
                grid-area: tools;
                transition-timing-function: ease-in-out;
            }

            .tools:hover {
                background-color: #000;
                color: #9cccff;
                border: 2px solid #9cccff;
            }

            .tools p {
                transition-timing-function: cubic-bezier();
                transition-duration: 0.3s;
            }

            .tools:hover p {
                scale: 1.1;
            }

            .about {
                font-family: 'Space Grotesk', monospace;
                background-color: #aa55ff;
                color: #fff;
                text-align: center;
                text-justify: left;
                border-radius: 8px;
                border: 2px solid #aa55ff;
                padding: 0.3em;
                transition-duration: 0.3s;
                text-decoration: none;
                grid-area: about;
                transition-timing-function: ease-in-out;
            }

            .about:hover {
                background-color: #000;
                color: #aa55ff;
                border: 2px solid #aa55ff;
            }

            .about p {
                transition-timing-function: cubic-bezier();
                transition-duration: 0.3s;
            }

            .about:hover p {
                scale: 1.1;
            }

            .club {
                font-family: 'Space Grotesk', monospace;
                background-color: #ec3750;
                color: #fff;
                text-align: center;
                text-justify: left;
                border-radius: 8px;
                border: 2px solid #ec3750;
                padding: 0.3em;
                transition-duration: 0.3s;
                text-decoration: none;
                grid-area: club;
                transition-timing-function: ease-in-out;
            }

            .club:hover {
                background-color: #000;
                color: #ec3750;
                border: 2px solid #ec3750;
            }

            .club p {
                transition-timing-function: cubic-bezier();
                transition-duration: 0.3s;
            }

            .club:hover p {
                scale: 1.1;
            }

            .stickyboi {
                box-sizing: border-box;
                padding: 0.3em;
                color: #fff;
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                margin: 0 auto;
                z-index: 10;
                backdrop-filter: blur(15px);
            }

            .stickyboi a {
                font-weight: bold;
                font-size: 1vw;
                text-decoration: none;
                color: #9cccff;
            }

            .stickyboi p {
                font-size: 1vw;
            }

            h1 {
                animation: fade-up 0.6s 0.1s both;
                text-align: center;
                font-family: 'Climate Crisis', sans-serif;
                color: #fff;
                font-size: 8vw;
                letter-spacing: 0.05em;
                line-height: 1;
                margin: 0;
                padding: 0;
                transition-duration: 0.3s;
                transition-timing-function: ease-in-out;
            }

            p {
                animation: fade-up 0.6s 0.3s both;
                text-align: center;
                font-family: 'Space Grotesk', monospace;
                font-size: 2vw;
                letter-spacing: 0.01em;
                line-height: 1.2;
                margin: 0;
                padding: 0;
            }

            .title-mobile {
                font-size: 12vw;
                display: none;
            }

            @media (max-width: 720px) {
                .body {
                    position: fixed;
                }

                .title-desktop {
                    display: none;
                }

                .title-mobile {
                    display: block;
                }

                .widgets p:not(.coding p) {
                    display: none;
                }

                .widgets {
                    grid-template-columns: 1fr 1fr 1fr;
                    width: 100%;
                }

                .widgets i{
                    font-size: 10vw;
                }

                .coding i, .coding svg{
                    display: none;
                }

                .coding p {
                    font-size: 4vw;
                }

                h1 {
                    padding-top: 0.1em;
                }

                .items p {
                    font-size: 6vw;
                }

                .stickyboi a {
                    font-size: 2vw;
                }

                .stickyboi p {
                    font-size: 2vw;
                }

                .items {
                    animation-delay: 0.3s;
                    grid-template-areas:
                        "title"
                        "tools"
                        "about"
                        "club";
                    align-items: center;
                    justify-content: center;
                    grid-template-columns: 1fr;
                    grid-template-rows: auto auto auto;
                    width: 100%;
                }

                .main-container {
                    grid-template-columns: 100%;
                    grid-template-rows: 1fr 3fr;
                    justify-content: center;
                }
            }

        </style>
    </head>

    <body>
        <h1 class="title-desktop">MATTEO'S SITE</h1>
        <h1 class="title-mobile">MATTEO'S<br>SITE</h1>
        <div class="main-container">
            <div class="widgets">
                <p style="color: #fff;">stuff</p>
                <a href="https://github.com/gtx-lover-69" class="github">
                    <i class="fa-brands fa-github blurjs"></i>
                    <p>my github</p>
                </a>
                <a href="https://discordapp.com/users/1306328691659509851" class="discord">
                    <i class="fa-brands fa-discord blurjs"></i>
                    <p>add me on<br>discord</p>
                </a>
                <div class="coding">
                    <i class="fa-solid fa-code"></i>
                    <p id="coding-time">coding for a long time...</p>
                </div>
            </div>
            <div class="items">
                <p style="color: #fff; grid-area: title;">more stuff</p>
                <a href="tools.html" class="tools">
                    <p>/tools</p>
                </a>
                <a href="aboutme.html" class="about">
                    <p>/aboutme</p>
                </a>
                <a href="hackclub.html" class="club">
                    <p>/hackclub</p>
                </a>
            </div>
        </div>
        <div class="stickyboi">
            <p>made with ♥ by matteo</p>
            <p><a id="commit-link" href="#" style="color:#fff;">loading commit...</a></p>
        </div>

        <script>
            async function loadCodingTime() {
                const el = document.getElementById("coding-time");
                try {
                    const res = await fetch("https://hackatime.hackclub.com/api/v1/users/matteoduda/stats");
                    const json = await res.json();
                    const seconds = json.total_seconds ?? json.data?.total_seconds;
                    const hours = Math.floor(seconds / 3600);
                    const mins = Math.floor((seconds % 3600) / 60);
                    el.innerHTML = `coding for <br>${hours}h ${mins}m`;
                } catch (err) {
                    console.error("Hackatime fetch failed:", err);
                    el.textContent = "coding for all eternity";
                }
            }
            loadCodingTime();

            async function loadLatestCommit() {
                const owner = "gtx-lover-69";
                const repo = "gtx-lover-69.github.io";
                const branch = "main";

                const el = document.getElementById("commit-link");
                try {
                    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/commits/${branch}`);
                    const json = await res.json();
                    const sha = json.sha.slice(0, 7);
                    el.textContent = `commit ${sha}`;
                    el.href = json.html_url;
                } catch (err) {
                    console.error("Commit fetch failed:", err);
                    el.textContent = "commit unknown";
                }
            }
            loadLatestCommit();

            const body = document.body;

            let targetX = 0, targetY = 0;
            let currentX = 0, currentY = 0;
            const lerpFactor = 0.1;

            function detectMob() {
                return ((window.innerWidth <= 720));
            }

            body.addEventListener('mousemove', (e) => {
                const rect = body.getBoundingClientRect();
                let isMobile = detectMob;
                if (!isMobile()) {
                    targetX = 0 -((e.clientX - rect.left) / rect.width);
                    targetY = 0 -((e.clientY - rect.top) / rect.height);
                }
                
            });

            function animateBG() {
                currentX += (targetX - currentX) * lerpFactor;
                currentY += (targetY - currentY) * lerpFactor;

                body.style.setProperty('--bg-x', `${currentX}%`);
                body.style.setProperty('--bg-y', `${currentY}%`);
                requestAnimationFrame(animateBG);
            }

            requestAnimationFrame(animateBG);

        </script>
    </body>
</html>
